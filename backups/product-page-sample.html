  button {
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

*:focus {
  outline: none;
}

a:focus-visible,
button:focus-visible,
[role="button"]:focus-visible,
[tabindex]:not([tabindex="-1"]):not(input):not(textarea):not(select):focus-visible {
  outline: 2px solid #000000;
  outline-offset: 2px;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.8), 0 0 0 5px rgba(0, 0, 0, 0.3);
}

a:focus-visible {
  text-decoration: underline;
}

.a11y-focus:focus-visible {
  outline: 2px solid #000000;
  outline-offset: 2px;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.8), 0 0 0 5px rgba(0, 0, 0, 0.3);
}

.a11y-focus-none:focus,
.a11y-focus-none:focus-visible {
  outline: none !important;
  box-shadow: none !important;
}

.a11y-focus-overflow:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px #000000;
}

  :root {
  --color_promo_primary: #F93A00;
  --color_promo_base: #FC4812;
  --color_promo_elevated: #FF6233;
  --color_promo_light: #FFF1EB;
  --color_promo_overlay_primary: rgba(255, 72, 18, 0.9);
  --color_promo_border_light: rgba(255, 72, 18, 0.4);
  --color_safety_primary: #007D49;
  --color_safety_base: #008C52;
  --color_safety_elevated: #00B86B;
  --color_safety_light: #E6FAF0;
  --color_safety_border_light: rgba(0, 140, 82, 0.4);
  --color_brand_primary: #000000;
  --color_neutrals_text_tertiary: #767676;
  --color_neutrals_text_hint: #959595;
  --color_neutrals_text_disabled: #BBBBBB;
  --color_benefit_feature: #A86104;


  /* 商卡相关 start */
  --product-card_color-discount: #F93A00;
  --product-card_color-discount-old: #FA6338;
  --product-card_color-new-tag: #3CBD45;

  --product-card_operation-opacity-black-bg: rgba(0, 0, 0, 0.5);
  --product-card_operation-opacity-black-bg: rgba(0, 0, 0, 0.6);
  /* 商卡相关 end */
  --color_home_trend: #9462FF;
}

@media (prefers-contrast: more) {
  :root {

    --color_safety_border_light: #008850;

    --product-card_operation-opacity-black-bg: rgba(0, 0, 0, 0.7);

    /* 商卡相关 end */
    --color_home_trend: #7442DF;
  }
}

    <script>
  // 获取阈值下限 
  function getThresholdLower() {
    // 页面有 sw
    if (
      window?.SaPageInfo?.page_name === 'page_checkout' ||
      window?.SaPageInfo?.page_name === 'page_cart'
    ) {
      return 0
    }
    return 100
  }
  window.__FSP_OPTIONS__ = {
    mode: 'manual',
    // 在容器中要忽略的元素的 class 列表, 比如弹窗我们并不关心, 需要 ignore 掉
    ignoreClasses: [
      'branch-first', // app 引流弹窗
      'c-vue-coupon', // 首页优惠券弹窗
      'c-quick-register', // 注册弹窗
    ],
    // 超时时间 (单位毫秒), 如果用户无操作, 最长多久结算 fsp
    timeout: 10 * 1000,
    // 记录 fsp 时间的阈值下限 (单位毫秒), 低于这个阈值的 fsp 不会上报 (比如fsp 发生在浏览器前进/后退时有缓存的场景, 这种情况下, fsp 一般为一个很小的值, 大概率在 30ms 左右)
    thresholdLower: getThresholdLower,
    // 记录 fsp 时间的阈值上限 (单位毫秒), 超过这个阈值的 fsp 不会上报
    thresholdUpper: 15 * 1000,
    // 相同场景跳转的采样数量
    sceneSampleCount: 5,
    // 如果触发 fsp 结算时, 页面滚动超过一定距离, 这样可能曝光非首屏元素, 而非首屏元素可能没有经过专门优化 (比如 SSR),
    // 所以不适合上报 fsp 的值; 此配置项用来设置: 当页面滚动超过多少距离时, 就不上报 fsp
    ignoreScrollY: {
      // 可以设置像素值, 也可以设置相对于一页的高度的值: 比如 1/2 页高度的距离
      unit: 'page',
      value: 0.3
    }
  }
</script>

<script>
  const parseQueryString = (queryString) => {
    const params = {}
    const queries = queryString[0] === '?' ? queryString.substring(1) : queryString
    const pairs = queries.split('&')
    for (let i = 0; i < pairs.length; i++) {
      const pair = pairs[i].split('=')
      const key = decodeURIComponent(pair[0])
      const value = decodeURIComponent(pair[1] || '')
      if (!params.hasOwnProperty(key)) {
        params[key] = value
      } else if (Array.isArray(params[key])) {
        params[key].push(value)
      } else {
        params[key] = [params[key], value]
      }
    }
    return params
  }

  const { url_from = '', aff_id = '', onelink = '', scene = '', page_version = '' } = parseQueryString(window.location.search)
  const isMarketing = url_from || aff_id || onelink || scene === 'onelink'
  var page_version_defined = ""
  var streamingType =  ""
  ;(function() {
    window.fspSDK.updateOptions({
      reporterHandler({ name, value, payload = {} } = {}) {      
        if (!name || !value || window.isClientBot) {
          return
        }
  
        const pageName = window?.SaPageInfo?.page_name || ''
  
        const resource = payload.resource || ''
        const pageFrom = isMarketing ? 'Marketing' : 'Home'
        let pageVersion = page_version_defined || page_version || 'Other'
        
        let renderType = resource === 'ssr-landing-page' ? 'ssr' : 'spa'
        if (streamingType) {
          renderType = 'ssr-streaming'
          pageVersion = streamingType
        }

        // 自定义场景，登录弹窗 dialog_login 店配弹窗 dialog_store_address 
        let customSceneName = ''
        if (resource === 'custom-scene' && payload?.customSceneContainer) {
          let customSceneContainer = payload?.customSceneContainer
          if (customSceneContainer instanceof Element || customSceneContainer instanceof HTMLDocument) {
            customSceneContainer = customSceneContainer.getAttribute('data-customSceneName')
          }
          if (customSceneContainer && typeof customSceneContainer === 'string') {
            customSceneName = customSceneContainer
          }
        }

        window.TPM?.run({
          marketing: 'ClientAnalytics',
          method: '_defineTrack',
          params: {
            data: {
              resource,
              page_from: pageFrom,
              page_version: pageVersion,
              render_type: renderType,
              data: [
                {
                  key_path: name,
                  values: { num: value }
                },
              ],
              // 1. 固定 page_name 防止上报时 page_name 已经被篡改
              ...(pageName ? { page_name: pageName } : {}),
              // 2. 弹窗类型 替换 page_name 为 弹窗对应的 name
              ...(customSceneName ? { page_name: customSceneName } : {}),
            },
            options: {
              random: 1,
              immediate: true,
            },
          }
        })
        document.dispatchEvent(new Event('SStramingRenderPerformance'))
      }
    })
  })();
</script>
